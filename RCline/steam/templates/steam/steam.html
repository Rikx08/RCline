{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'steam/css/steam_style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam</title>
</head>
<body>
    <div id="navbar">
        <div id="buttons">
            <button class="nav-button home" onclick="window.location.href='{% url 'home' %}'">Home</button>
            <button class="nav-button steam" onclick="window.location.href='{% url 'steam' %}'">Steam</button>
            <button class="nav-button youtube" onclick="loadContent('youtube')">YouTube</button>
            <button class="nav-button chatick" onclick="loadContent('chatick')">Chatick</button>
        </div>
        <button id="extra-button"></button>
    </div>

    <div id="content"></div>

    <script>

       let socket = new WebSocket("ws://localhost:8000/ws/steam/");
            let page = 1;
            let loading = false;
            let content = document.getElementById("content");

            // 🔹 Создаём элемент, за которым будем следить
            let scrollTrigger = document.createElement("div");
            scrollTrigger.style.height = "20px";
            scrollTrigger.style.margin = "10px auto";
            content.appendChild(scrollTrigger);

            socket.onopen = function() {
                console.log("✅ WebSocket соединение установлено");
                loadMoreGames();  // Загружаем первую страницу
            };

            socket.onerror = function(error) {
                console.error("❌ WebSocket ошибка:", error);
            };

            socket.onmessage = function(event) {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    console.error("❌ Ошибка парсинга JSON:", e);
                    return;
                }

                if (data.games.length === 0) {
                    console.log("❗ Больше игр нет.");
                    observer.disconnect();  // Отключаем наблюдение, если контент закончился
                    return;
                }

                data.games.forEach(game => {
                    let gameCard = document.createElement("div");
                    gameCard.className = "game-card";
                    gameCard.onclick = () => window.open(game.url, "_blank");
                    gameCard.style.cursor = "pointer";

                    gameCard.innerHTML = `
                        <div class="game-image"><img src="${game.img}" alt="Game Image"></div>
                        <div class="game-info"><h3>${game.title}</h3></div>
                        <div class="disc"><p><span class="discount">${game.percent}</span></p></div>
                        <div class="game-pricing">
                            <p> <span class="price-new">${game.price}</span></p>
                            <p> <span class="price-old">${game.full_price}</span></p>
                        </div>
                    `;

                    content.appendChild(gameCard);
                });

                // 🔹 Перемещаем `scrollTrigger` в конец контента
                content.appendChild(scrollTrigger);

                loading = false;
            };

            // 🔹 Функция загрузки игр
            function loadMoreGames() {
                if (loading || socket.readyState !== WebSocket.OPEN) return;
                loading = true;
                console.log(`📥 Загружаем страницу ${page}`);
                socket.send(JSON.stringify({ action: "load_games", page: page }));
                page++;
            }

            // 🔹 IntersectionObserver
            let observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    loadMoreGames();
                }
            }, { rootMargin: "100px" });

            observer.observe(scrollTrigger);  // Наблюдаем за `scrollTrigger`




    </script>
</body>
</html>
